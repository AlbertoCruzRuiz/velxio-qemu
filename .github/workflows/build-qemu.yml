name: Build and Publish Velxio IoT QEMU

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu:
    name: Build QEMU (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    # Export the exact image tag actually published by this job.
    outputs:
      sha_image: ${{ steps.meta.outputs.sha_image }}

    steps:
      - name: Checkout QEMU source
        uses: actions/checkout@v6

      - name: Validate source inputs
        shell: bash
        run: |
          set -euo pipefail

          test -s build_libqemu-esp32.sh

          for rom in \
            esp32-v3-rom.bin \
            esp32-v3-rom-app.bin \
            esp32c3-rom.bin \
            esp32s3_rev0_rom.bin
          do
            test -s "pc-bios/${rom}"
          done

          echo "Source commit: ${GITHUB_SHA}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          sha_image="${image}:sha-${GITHUB_SHA}"

          {
            echo "image=${image}"
            echo "sha_image=${sha_image}"
            echo "tags<<EOF"
            echo "${sha_image}"

            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${image}:latest"
            elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "${image}:${GITHUB_REF_NAME}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, validate and publish QEMU
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.qemu
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=velxio-qemu
          cache-to: type=gha,scope=velxio-qemu,mode=max
          provenance: mode=min

      - name: Build summary
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "### Velxio QEMU build"
            echo ""
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Event: \`${EVENT}\`"
            echo "- Digest: \`${DIGEST:-not published}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-velxio:
    name: Notify Velxio IoT
    needs: build-qemu
    # On PRs we only validate; version-tag builds do not advance :latest.
    # A manual run on main also publishes :latest and should notify Velxio.
    if: >-
      ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - name: Dispatch QEMU update to velxio_iot
        shell: bash
        env:
          TOKEN: ${{ secrets.VELXIO_IOT_DISPATCH_TOKEN }}
          QEMU_IMAGE: ${{ needs.build-qemu.outputs.sha_image }}
        run: |
          set -euo pipefail

          if [[ -z "${TOKEN}" ]]; then
            echo "::error::Configure VELXIO_IOT_DISPATCH_TOKEN as an Actions secret in velxio-qemu."
            exit 1
          fi
          if [[ -z "${QEMU_IMAGE}" ]]; then
            echo "::error::The QEMU build did not provide a published image tag."
            exit 1
          fi

          # QEMU_IMAGE comes from this build's image metadata, not user input.
          printf '{"event_type":"qemu-published","client_payload":{"qemu_image":"%s"}}' \
            "${QEMU_IMAGE}" > "${RUNNER_TEMP}/qemu-dispatch.json"

          status="$(curl --silent --show-error --fail-with-body \
            --output "${RUNNER_TEMP}/qemu-dispatch-response.txt" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data-binary "@${RUNNER_TEMP}/qemu-dispatch.json" \
            'https://api.github.com/repos/AlbertoCruzRuiz/velxio_iot/dispatches')"

          if [[ "${status}" != '204' ]]; then
            echo "::error::Unexpected repository_dispatch response: HTTP ${status}"
            exit 1
          fi

          {
            echo '### Velxio IoT notified'
            echo ''
            echo "- QEMU image: \`${QEMU_IMAGE}\`"
            echo '- Event: `qemu-published`'
            echo '- Target repository: `AlbertoCruzRuiz/velxio_iot`'
            echo '- Dispatch accepted (HTTP 204)'
          } >> "$GITHUB_STEP_SUMMARY"
