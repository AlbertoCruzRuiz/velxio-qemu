name: Build and Publish Velxio QEMU

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: qemu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qemu:
    name: Build QEMU (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout QEMU source
        uses: actions/checkout@v6

      - name: Validate source inputs
        shell: bash
        run: |
          set -euo pipefail

          test -s build_libqemu-esp32.sh

          for rom in \
            esp32-v3-rom.bin \
            esp32-v3-rom-app.bin \
            esp32c3-rom.bin \
            esp32s3_rev0_rom.bin
          do
            test -s "pc-bios/${rom}"
          done

          echo "Source commit: ${GITHUB_SHA}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"

          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:sha-${GITHUB_SHA}"

            if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
              echo "${image}:latest"
            elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "${image}:${GITHUB_REF_NAME}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, validate and publish QEMU
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.qemu
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=velxio-qemu
          cache-to: type=gha,scope=velxio-qemu,mode=max
          provenance: mode=min

      - name: Build summary
        shell: bash
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "### Velxio QEMU build"
            echo ""
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Platform: \`linux/amd64\`"
            echo "- Event: \`${EVENT}\`"
            echo "- Digest: \`${DIGEST:-not published}\`"
          } >> "$GITHUB_STEP_SUMMARY"
