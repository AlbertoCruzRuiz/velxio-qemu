name: Check and Propose Velxio QEMU Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      source_asset:
        description: 'Optional: qemu-source-63b37f5e (empty = newest in manifest)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: velxio-qemu-updates
  cancel-in-progress: false

jobs:
  propose-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Validate updater (offline tests, no secrets)
        run: python3 -m unittest discover -s tests -v

      - name: Identify initial import
        shell: bash
        run: |
          if [[ ! -f upstream-version.json || ! -f build_libqemu-esp32.sh ]]; then
            echo 'INITIAL IMPORT: QEMU source not yet populated on main.'
            echo 'The updater must prepare a PR with the entire verified source tree.'
          else
            echo 'UPDATE CHECK: existing QEMU sources found.'
          fi

      - name: Download, verify and stage QEMU source (no code execution)
        id: sync
        shell: bash
        env:
          VELXIO_LICENSE_KEY: ${{ secrets.VELXIO_LICENSE_KEY }}
          SOURCE_ASSET: ${{ inputs.source_asset || '' }}
        run: |
          set -euo pipefail
          python3 -u maintenance/sync_velxio_qemu.py

      - name: Inspect staged import
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo 'First changed paths (source only, no secret values):'
          git status --short | head -40 || true
          echo "Tracked QEMU input files: $(python3 -c 'import json; print(len(json.load(open("upstream-files.json"))))')"
          test -s build_libqemu-esp32.sh
          test -s configure
          test -s meson.build

      - name: Create or update review PR (never auto-merge)
        id: pr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: bot/velxio-qemu-upstream
          delete-branch: true
          title: 'chore(qemu): import ${{ steps.sync.outputs.asset }}'
          commit-message: 'chore(qemu): import ${{ steps.sync.outputs.asset }}'
          body: |
            ## QEMU: fuente GPL-2.0 verificada

            - Revisión: `${{ steps.sync.outputs.asset }}`
            - SHA-256 de origen: `${{ steps.sync.outputs.sha256 }}`
            - Importada SIN ejecutar archivos del tarball

            **Revisión humana requerida. No fusionar automáticamente.**
            Comprobar compilación libqemu-xtensa/libqemu-riscv32 y las pruebas
            ESP32-S3, flash/PSRAM OPI, GPIO, Grove, WiFi y MQTT, sin secretos.
            Los cambios en código QEMU personalizado deben revisarse por separado.

      - name: Job summary (even if a step fails)
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          CHANGED: ${{ steps.sync.outputs.changed }}
          ASSET: ${{ steps.sync.outputs.asset }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo '## Velxio QEMU monitor'
            echo "Sync step: ${SYNC_OUTCOME:-not-run}"
            if [ "$SYNC_OUTCOME" = 'success' ]; then
              echo "Source changed: ${CHANGED:-false}"
            else
              echo '**Import failed or did not run. No conclusion about available updates.**'
              echo 'Expand the red step to view the exact failure, not just exit code.'
            fi
            if [ -n "$ASSET" ]; then echo "Source: \`$ASSET\`"; fi
            if [ -n "$PR_URL" ]; then echo "PR: $PR_URL"; fi
          } >> "$GITHUB_STEP_SUMMARY"
