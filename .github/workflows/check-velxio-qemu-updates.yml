name: Check and Propose Velxio QEMU Updates

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      source_asset:
        description: 'Optional: qemu-source-63b37f5e (blank = newest)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: velxio-qemu-updates
  cancel-in-progress: false

jobs:
  propose-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Test source importer offline
        run: python3 -m unittest discover -s tests -v

      - name: Download and verify QEMU source without executing it
        id: sync
        env:
          VELXIO_LICENSE_KEY: ${{ secrets.VELXIO_LICENSE_KEY }}
          SOURCE_ASSET: ${{ inputs.source_asset || '' }}
        run: python3 maintenance/sync_velxio_qemu.py

      - name: Create or update review PR
        id: pr
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: bot/velxio-qemu-upstream
          delete-branch: true
          title: 'chore(qemu): update to ${{ steps.sync.outputs.asset }}'
          commit-message: 'chore(qemu): import ${{ steps.sync.outputs.asset }}'
          body: |
            ## Actualización de fuentes QEMU
            - Revisión: `${{ steps.sync.outputs.asset }}`
            - SHA-256 verificado: `${{ steps.sync.outputs.sha256 }}`

            El archivo fue verificado e importado **sin ejecutar su código**.
            Nuestros workflows y scripts de mantenimiento no se sobrescribieron.

            **Revisar antes de mergear**. Compilar QEMU y comprobar ESP32-S3,
            flash/PSRAM OPI, GPIO, Grove, WiFi y MQTT en CI sin secretos.
            Tras el merge hay que actualizar el submódulo del fork de Velxio.

      - name: Job summary
        if: always()
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          ASSET: ${{ steps.sync.outputs.asset }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          echo '## Velxio QEMU monitor' >> "$GITHUB_STEP_SUMMARY"
          echo "Changed: ${CHANGED:-false}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ASSET" ]; then echo "Asset: $ASSET" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$PR_URL" ]; then echo "PR: $PR_URL" >> "$GITHUB_STEP_SUMMARY"; fi
